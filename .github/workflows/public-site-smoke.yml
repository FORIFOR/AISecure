name: public site smoke
on:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test]'
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tools/check_product_presentation.py --public --browser ${{ matrix.browser }} --out /tmp/public-site
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-${{ matrix.browser }}
          path: /tmp/public-site
          retention-days: 14
