name: patch homepage product references
on:
  push:
    branches: [fix/homepage-product-visual-20260917]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Point HTML directly at the valid capture
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('docs/index.html','docs/index.ja.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('media/workbench-actual.jpg','media/workbench-actual.png')
              s=s.replace('width="1440" height="1450"','width="1440" height="2597"')
              marker='<link rel="stylesheet" href="portfolio.css"/><link rel="stylesheet" href="home.css?v=premium-1"/>'
              replacement=marker+'<link rel="stylesheet" href="home-refine.css?v=20260917"/>'
              if 'home-refine.css' not in s:
                  s=s.replace(marker,replacement)
              p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/patch-home-product-references.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/index.ja.html .github/workflows/patch-home-product-references.yml
          git commit -m 'fix: point homepage at valid workbench capture'
          git push origin HEAD:${GITHUB_REF_NAME}
