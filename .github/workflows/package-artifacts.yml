name: package artifacts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install build '.[test]'
      - run: python tools/run_full_tests.py
      - run: python -m build
      - run: python tools/build_release.py
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: aisecure-alpha-package
          path: dist/
          retention-days: 30
