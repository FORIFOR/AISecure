name: refresh site verification manifest
on:
  push:
    branches: [fix/deployed-site-verification-20260916]
    paths: [.github/workflows/refresh-site-manifest.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'FORIFOR/AISecure' && github.ref == 'refs/heads/fix/deployed-site-verification-20260916'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove this one-time task and hash tracked files
        run: |
          git rm .github/workflows/refresh-site-manifest.yml
          python - <<'PY'
          import hashlib, pathlib, subprocess
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          lines = [hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() + '  ' + name for name in sorted(filter(None,names)) if name != 'SHA256SUMS.txt' and pathlib.Path(name).is_file()]
          pathlib.Path('SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
          sha256sum -c SHA256SUMS.txt
          git add SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh manifest after public-site verification fix'
          git push origin HEAD:fix/deployed-site-verification-20260916
