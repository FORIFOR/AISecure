name: patch homepage craft
on:
  push:
    branches: [polish/jp-craft-signature-20260917]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: polish/jp-craft-signature-20260917
      - name: Apply Japanese typography and signature markup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.ja.html')
          s=p.read_text(encoding='utf-8')
          replacements={
          '<p class="lead">送る内容と送信先を、実行前に確認。<br/>止めた理由と、その後の記録まで残します。</p>':'<p class="lead jp-copy"><span class="jp-line"><span class="jp-phrase">送る内容と送信先を、</span><span class="jp-phrase">実行前に確認。</span></span><span class="jp-line"><span class="jp-phrase">止めた理由と、</span><span class="jp-phrase">その後の記録まで残します。</span></span></p>',
          '<h2>送る前に、ここで判断します。</h2>':'<h2 class="jp-heading"><span class="jp-phrase">送る前に、</span><span class="jp-phrase">ここで判断します。</span></h2>',
          '<div class="signature-moment" data-signature>':'<div class="signature-moment" data-signature aria-label="送信前判定の流れ">',
          '<article class="sig-step verdict"><span class="sig-no">03</span><p class="sig-label">PG-002 / BLOCK</p><strong>この送信は拒否</strong><small>機密または持出禁止の分類です。</small></article></div></div></section>':'<article class="sig-step verdict"><span class="sig-no">03</span><p class="sig-label">PG-002 / BLOCK</p><strong>この送信は拒否</strong><small>機密または持出禁止の分類です。</small></article></div><div class="signature-outcome" aria-label="判定後の状態"><span>RESULT</span><strong>送信処理は未実行</strong><code>not_executed</code></div></div></section>',
          '<h2>送る前に、確認する。</h2>':'<h2 class="jp-heading"><span class="jp-phrase">送る前に、</span><span class="jp-phrase">確認する。</span></h2>',
          '<h2>止めた理由が、わかる。</h2>':'<h2 class="jp-heading"><span class="jp-phrase">止めた理由が、</span><span class="jp-phrase">わかる。</span></h2>',
          '<h2>過去の履歴も、調べる。</h2>':'<h2 class="jp-heading"><span class="jp-phrase">過去の履歴も、</span><span class="jp-phrase">調べる。</span></h2>',
          '<h2>4つの判定例を、<br/>実際のルールで。</h2>':'<h2 class="jp-heading jp-stack"><span class="jp-phrase">4つの判定例を、</span><span class="jp-phrase">実際のルールで。</span></h2>',
          '<h2>すべてを、<br/>この1つの画面で。</h2>':'<h2 class="jp-heading jp-stack"><span class="jp-phrase">すべてを、</span><span class="jp-phrase">この1つの</span><span class="jp-phrase">画面で。</span></h2>',
          '<h2>動きは、説明のためだけに。</h2>':'<h2 class="jp-heading"><span class="jp-phrase">動きは、</span><span class="jp-phrase">説明のためだけに。</span></h2>',
          '<h2>できることと、<br/>まだ確認していない範囲。</h2>':'<h2 class="jp-heading jp-stack"><span class="jp-phrase">できることと、</span><span class="jp-phrase">未確認の範囲。</span></h2>',
          '<h2>まずは、ローカルで。</h2>':'<h2 class="jp-heading"><span class="jp-phrase">まずは、</span><span class="jp-phrase">ローカルで。</span></h2>',
          '<h2>誤解しやすいところだけ。</h2>':'<h2 class="jp-heading"><span class="jp-phrase">誤解しやすい</span><span class="jp-phrase">ところだけ。</span></h2>',
          '<h2 id="business-heading">自社のAI利用で、<br/>確かめたいことは？</h2>':'<h2 id="business-heading" class="jp-heading jp-stack"><span class="jp-phrase">自社のAI利用で、</span><span class="jp-phrase">確かめたい</span><span class="jp-phrase">ことは？</span></h2>',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('missing expected markup: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tools/check_product_presentation.py')
          s=p.read_text(encoding='utf-8')
          old="    assert not page.evaluate('document.documentElement.scrollWidth>innerWidth'),(lang,width,'overflow')\n"
          new=old+"    if lang=='ja':\n     broken=page.locator('.jp-phrase').evaluate_all(\"\"\"els => els.filter(el => { const cs=getComputedStyle(el); const lh=parseFloat(cs.lineHeight); const r=el.getBoundingClientRect(); return (Number.isFinite(lh) && r.height > lh*1.45) || r.width > innerWidth - 24; }).map(el=>el.textContent.trim())\"\"\")\n     assert not broken,(lang,width,'jp-phrase-wrap',broken)\n"
          if old not in s:
              raise SystemExit('presentation assertion anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit craft pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.ja.html tools/check_product_presentation.py
          git commit -m 'polish: control Japanese line breaks and signature copy'
          git push origin HEAD:polish/jp-craft-signature-20260917
