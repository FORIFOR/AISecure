name: managed quality
on:
  push:
    branches: [main, feat/managed-security-workbench-20260916]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python tools/update_manifest.py --check
      - run: python tools/run_full_tests.py --report /tmp/quality/tests.json
      - run: python tools/release_gate.py --self-test
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-security-${{ matrix.python }}
          path: /tmp/quality/
          retention-days: 14
  browsers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test]'
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/setup-node@v4
        if: matrix.browser == 'chromium'
        with:
          node-version: '22'
      - name: Install control browser test runtime
        if: matrix.browser == 'chromium'
        run: |
          npm install --prefix /tmp/control-browser --no-save --ignore-scripts playwright@1.62.1
          node /tmp/control-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check control document flow
        if: matrix.browser == 'chromium'
        env:
          NODE_PATH: /tmp/control-browser/node_modules
          AISECURE_PYTHON: python
        run: node tools/check_control_browser.cjs /tmp/quality/control
      - run: python tools/check_workbench.py --browser ${{ matrix.browser }} --out /tmp/quality/workbench
      - run: python tools/check_product_presentation.py --browser ${{ matrix.browser }} --out /tmp/quality/site
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: /tmp/quality/
          retention-days: 14
  isolated-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash deployment/check-egress.sh | tee /tmp/egress.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-egress
          path: /tmp/egress.txt
          retention-days: 14
