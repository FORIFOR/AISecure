name: build product presentation
on:
  push:
    branches: [feat/product-presentation-20260916]
    paths:
      - 'tools/presentation-transfer-*.txt'
      - '.github/workflows/presentation-transfer.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'FORIFOR/AISecure' && github.ref == 'refs/heads/feat/product-presentation-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Decode hash-verified presentation sources
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'tools/presentation-transfer-{i}.txt').read_text().strip() for i in range(4))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'd6d4e0007ceb2c274e288642f238206678f6ffc97a3ca42cb44d70fb630d2623'
          sources = json.loads(raw)
          allowed = {'docs/index.html', 'docs/index.ja.html', 'docs/home.css', 'docs/home.js', 'docs/portfolio.js', 'tools/render_product_film.py', 'tools/check_product_presentation.py', 'tests/test_product_presentation.py', 'docs/site/PRESENTATION-20260916.md'}
          assert set(sources) == allowed
          for name, content in sources.items():
              assert isinstance(content, str)
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          print('Verified and decoded 9 presentation source files.')
          PY
      - name: Install media and browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install Pillow==12.3.0 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Render original bilingual 18-second films
        run: python tools/render_product_film.py --out docs/media
      - name: Repository regression tests
        run: python -m unittest discover -s tests -v
      - name: Eight local HTTP layouts and native video playback
        run: python tools/check_product_presentation.py --out /tmp/aisecure-presentation-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: presentation-qa
          path: /tmp/aisecure-presentation-check
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit source and media only to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/index.html docs/index.ja.html docs/home.css docs/home.js docs/portfolio.js docs/media/product-film-ja.mp4 docs/media/product-film-en.mp4 docs/media/product-film-ja-poster.jpg docs/media/product-film-en-poster.jpg docs/media/product-film-ja.vtt docs/media/product-film-en.vtt tools/render_product_film.py tools/check_product_presentation.py tests/test_product_presentation.py docs/site/PRESENTATION-20260916.md
          git rm -- tools/presentation-transfer-0.txt tools/presentation-transfer-1.txt tools/presentation-transfer-2.txt tools/presentation-transfer-3.txt .github/workflows/presentation-transfer.yml
          git commit -m 'feat: publish original product films and bilingual visual redesign'
          git push origin HEAD:feat/product-presentation-20260916
