name: workbench source snapshot
on:
  push:
    branches: [feat/managed-security-workbench-20260916]
    paths: [.github/workflows/workbench-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git archive --format=tar HEAD > /tmp/aisecure-source.tar
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-source
          path: /tmp/aisecure-source.tar
          retention-days: 1
