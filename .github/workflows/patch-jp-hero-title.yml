name: patch Japanese hero title
on:
  push:
    branches: [polish/jp-craft-signature-20260917]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: polish/jp-craft-signature-20260917
      - name: Keep hero title in semantic phrases
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.ja.html')
          s=p.read_text(encoding='utf-8')
          old='<h1>AIに渡す前に、<br/><em>確かめる。</em></h1>'
          new='<h1 class="jp-hero-title"><span class="jp-phrase">AIに渡す前に、</span><em class="jp-phrase">確かめる。</em></h1>'
          if old not in s:
              raise SystemExit('hero title anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.ja.html
          git commit -m 'polish: keep Japanese hero title in two semantic lines'
          git push origin HEAD:polish/jp-craft-signature-20260917
